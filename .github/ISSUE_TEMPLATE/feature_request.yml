name: Feature request
description: Suggest a capability or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please read the **Things that are deliberate, not oversights** section of
        [CONTRIBUTING.md](https://github.com/happySNAG/model-lab/blob/main/CONTRIBUTING.md#things-that-are-deliberate-not-oversights) first — several obvious-looking ideas
        (an LLM judge, editable suites, remote Ollama hosts, telemetry) are ruled out on purpose.
  - type: textarea
    id: problem
    attributes:
      label: What decision are you trying to make?
      description: Describe the situation, not the solution. What are you trying to find out about which models?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: What would Cernum do differently?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: How do you work around it now, if at all?
