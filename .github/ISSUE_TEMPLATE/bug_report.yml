name: Bug report
description: Something in Cernum behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The single most useful thing you can attach is the diagnostics report:
        in Cernum, go to **Settings & diagnostics → Copy diagnostics** and paste it below. It
        contains only your machine's hardware summary, the app version, your settings and store
        counts — no prompts, no answers, no personal data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what did you get instead?
      placeholder: |
        1. Opened the Benchmark screen
        2. Selected llama3.2:3b and Quick check
        3. Pressed Start
        4. Expected the live run to begin; instead …
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Other / built from source on something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cernum version
      description: Shown in Settings & diagnostics, or in the About panel.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Downloaded a release build (DMG / installer / portable)
        - Built from source
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: Settings & diagnostics → Copy diagnostics, then paste here.
      render: json
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines
      description: "Help → Show Log File. Paste the last lines around the failure, if any."
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      options:
        - label: I have checked that what I am pasting contains no personal information.
          required: true
