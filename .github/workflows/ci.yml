name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Engine, types and bundles on all three platforms. The core engine is pure TypeScript, so this is
  # a genuine cross-platform check of everything except the packaged application itself.
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and parity suites
        run: npm test
      - name: Build renderer, preload and main bundles
        run: npm run build

  # End-to-end: Playwright drives the real Electron application. macOS is the reference platform;
  # Windows runs the same specs so that Windows-specific main-process behaviour (paths, menu
  # accelerators, settings persistence) is exercised on a real Windows kernel. This is NOT a
  # substitute for a smoke test of the packaged installer on physical Windows hardware.
  e2e:
    name: End-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Playwright end-to-end suite
        run: npm run test:e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.os }}
          path: test-results/
          retention-days: 7
